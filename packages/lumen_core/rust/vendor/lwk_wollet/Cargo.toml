[package]
edition = "2021"
name = "lwk_wollet"
version = "0.19.0"
build = false
exclude = [
    "tests/",
    "benches/",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Liquid Wallet Kit - Watch-only wallet based on CT Descriptors"
documentation = "https://docs.rs/lwk_wollet"
readme = false
license = "MIT OR BSD-2-Clause"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
