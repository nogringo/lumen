    "tokio-tungstenite",
    "rustls",
    "reqwest",
    "scrypt",
    "pbkdf2",
    "sha2",
    "hmac",
    "aes",
    "cbc",
    "aes-gcm",
    "flate2",
    "rmpv",
    "rmp-serde",
]
amp2 = ["reqwest"]
bindings = []
default = [
    "esplora",
    "electrum",
    "electrum_oidc",
    "elements_rpc",
    "amp2",
    "amp0",
    "prices",
    "registry",
]
electrum = ["electrum-client"]
electrum_oidc = [
    "electrum",
    "reqwest",
]
elements_rpc = ["bitcoincore-rpc"]
esplora = [
    "reqwest",
    "age",
]
prices = ["reqwest"]
registry = ["reqwest"]
serial = ["lwk_jade/serial"]
test_wallet = ["lwk_signer"]

[lib]
name = "lwk_wollet"
