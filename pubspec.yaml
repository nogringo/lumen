name: lumen
description: "Every way you hold bitcoin, in one place."
publish_to: 'none'

version: 0.1.1+2

environment:
  sdk: ^3.13.5

workspace:
  - packages/lumen_core
  - packages/lumen_wallets

dependencies:
  clock: ^1.1.3
  cryptography: ^2.9.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  intl: ^0.20.3
  lumen_wallets:
    path: packages/lumen_wallets
  material_ui: ^1.6.0
  ndk_flutter: ^0.10.1
  path: ^1.9.1
  path_provider: ^2.1.6
  qr: ^3.0.2
  sembast: ^3.9.0
  sembast_web: ^2.4.6+1
  serverpod_argon2: ^0.1.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6

dev_dependencies:
  bech32: ^0.2.2
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  http: ^1.6.0
  ndk: ^0.10.1

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
