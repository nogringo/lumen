name: Release

on:
  push:
    tags: ['v*']

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  android:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches pubspec.yaml
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $version"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
          pub-cache: true

      - name: Write the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build the universal APK
        run: |
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk "lumen-$GITHUB_REF_NAME.apk"

      # Same versionCode as the universal APK, so users can switch between the two on update.
      - name: Build the arm64 APK
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm64 \
            -P force-version-code-ignoring-abi=true
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "lumen-$GITHUB_REF_NAME-arm64.apk"

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            lumen-${{ github.ref_name }}.apk
            lumen-${{ github.ref_name }}-arm64.apk
          generate_release_notes: true
