name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
          pub-cache: true

      - run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test tool packages

      - name: Analyze
        run: flutter analyze

      - name: Test app
        run: flutter test

      - name: Test lumen_wallets
        working-directory: packages/lumen_wallets
        run: dart test
