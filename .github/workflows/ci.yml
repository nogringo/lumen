name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
          pub-cache: true

      - run: flutter pub get

      - name: Format
        # Not `packages`: the vendored Cargokit build_tool has no pub get here, so it parses at the wrong language version.
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool packages/lumen_core/lib packages/lumen_wallets

      - name: Analyze
        run: flutter analyze

      - name: Test app
        run: flutter test

      - name: Test lumen_wallets
        working-directory: packages/lumen_wallets
        run: dart test

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/lumen_core/rust
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/lumen_core/rust

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test lumen_core
        run: cargo test --locked

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cargokit-build: build/linux/x64/debug/plugins/lumen_core/cargokit_build
          - os: windows-latest
            cargokit-build: build/windows/x64/plugins/lumen_core/cargokit_build
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
          pub-cache: true

      # Cargokit builds the crate inside Flutter's build folder, not in rust/target.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/lumen_core/rust -> ../../../${{ matrix.cargokit-build }}

      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev xvfb

      - name: Run LWK in the Linux app
        if: runner.os == 'Linux'
        run: xvfb-run -a flutter test integration_test -d linux

      - name: Run LWK in the Windows app
        if: runner.os == 'Windows'
        run: flutter test integration_test -d windows
